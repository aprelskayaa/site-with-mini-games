    <a href="game.html" class="nav-link" id="gameBtn" style="
    justify-content: center;
    display: block;
    margin: 0 auto;
    padding: 12px 24px;
    background-color: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    text-align: center;
    transition: background-color 0.3s;
    background-color: darkred;
    border-radius: 30px;
    width: fit-content;
    font-size: 30px;
    ">Игры</a>

    <script>
        const homeButton = document.getElementById('homeBtn');
        const gameButton = document.getElementById('gameBtn');

        homeButton.addEventListener('click', function (e) {
            e.preventDefault();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
   
        //gameButton.addEventListener('click', function (e) {
        //    e.preventDefault();
        //    if (gameSection) {
        //        const yOffset = -120;
        //        const y = gameSection.getBoundingClientRect().top + window.scrollY + yOffset;
        //        window.scrollTo({ top: y, behavior: 'smooth' });
        //    }
        //});
        // На ГЛАВНОЙ странице (index.html):
        gameButton.addEventListener('click', function (e) {
            // Ничего не делаем - просто переходим по ссылке
            // Браузер сам откроет game.html
        });

        // На странице ИГР (game.html):
        document.addEventListener('DOMContentLoaded', function () {
            const gameSection = document.getElementById('games-section');
            if (gameSection) {
                const yOffset = -120;
                window.scrollTo({
                    top: gameSection.offsetTop + yOffset,
                    behavior: 'smooth'
                });
            }
        });

    </script>
